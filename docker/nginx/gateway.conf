server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Landing page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # GraphQL API - proxy to Saleor (CORS handled by Saleor's CORS_ALLOWED_ORIGINS)
    location /graphql/ {
        proxy_pass http://saleor:8000/graphql/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # JWKS endpoint - required for Saleor app webhook signature verification
    # The ShipRocket app fetches /.well-known/jwks.json to verify webhook signatures
    location /.well-known/ {
        proxy_pass http://saleor:8000/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Saleor dynamic endpoints (Thumbnails, Plugins, Downloads)
    location /thumbnail/ {
        proxy_pass http://saleor:8000/thumbnail/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /plugins/ {
        proxy_pass http://saleor:8000/plugins/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /digital-download/ {
        proxy_pass http://saleor:8000/digital-download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Dashboard - proxy to dashboard service
    location /dashboard/ {
        proxy_pass http://dashboard:80/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static files from Saleor
    location /static/ {
        proxy_pass http://saleor:8000/static/;
        proxy_set_header Host $host;
    }

    # Media files served directly by nginx from the mounted saleor-media volume.
    # Django does NOT serve /media/ in production (DEBUG=False) - nginx must.
    location /media/ {
        root /app;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin *;
        # Return 404 for missing files instead of hanging
        try_files $uri =404;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
